[package]
name = "sw-listen"
description = "SimpleWorship's Listen: speech to text from a microphone, on this computer (Whisper), for finding the scripture a preacher reads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cpal = "0.18"
log = "0.4"
thiserror.workspace = true
whisper-rs = "0.16"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Apple's own chips make speech to text several times faster. (Not Intel
# Macs: whisper.cpp's Metal code gives empty text on their AMD and Intel
# graphics, and their processors are fast enough.)
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
# For the example that tries a model on a recording.
sw-bible.workspace = true

[lints]
workspace = true
