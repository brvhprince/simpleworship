[package]
name = "simpleworship-desktop"
description = "SimpleWorship desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
# Tauri's mobile targets need the staticlib/cdylib crate types.
name = "simpleworship_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The program's file name is what the system shows in some places (Force
# Quit, Mission Control and the menu bar on a Mac, Task Manager on
# Windows), so it is the app's name.
[[bin]]
name = "SimpleWorship"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
imagesize = "0.15"
local-ip-address = "0.6"
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
sw-bible.workspace = true
sw-core.workspace = true
sw-db.workspace = true
sw-files.workspace = true
sw-import.workspace = true
sw-server.workspace = true
# protocol-asset serves media files to the webview (with range requests,
# so videos can seek).
tauri = { version = "2.12", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.14"
log = "0.4"
thiserror.workspace = true
ts-rs.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"

# NDI SPIKE: temporarily not the workspace lints (they forbid unsafe code).
[lints.rust]
unsafe_code = "allow"

# Windows: the font list comes from DirectWrite, as the output does (see
# `commands::themes::fonts_list`).
[target.'cfg(windows)'.dependencies]
dwrote = "0.11"
# NDI experiment (debug builds only; see src/ndi_spike.rs).
png = "0.17"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

# Elsewhere, from the font folders.
[target.'cfg(not(windows))'.dependencies]
fontdb = "0.24"

# NDI experiment (debug builds only; see src/ndi_spike.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSColor", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
