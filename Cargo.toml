[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/brvhprince/simpleworship"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
sw-bible = { path = "crates/sw-bible" }
sw-core = { path = "crates/sw-core" }
sw-listen = { path = "crates/sw-listen" }
sw-db = { path = "crates/sw-db" }
sw-files = { path = "crates/sw-files" }
sw-import = { path = "crates/sw-import" }
sw-ndi = { path = "crates/sw-ndi" }
sw-server = { path = "crates/sw-server" }

# Shared third-party crates
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
# Pure-Rust deflate only: no C compiler needed on any platform.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# NDI's pixel work (fades, alpha) is far too slow unoptimized, even while
# developing.
[profile.dev.package.sw-ndi]
opt-level = 3

# Speech to text (whisper.cpp, built by cmake) is far too slow unoptimized
# for Listen to keep up with a preacher, even while developing.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
