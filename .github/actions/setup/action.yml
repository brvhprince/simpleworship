# Shared setup for CI jobs: system libraries, Rust, Node and pnpm.
name: Setup
description: Install the toolchains and dependencies SimpleWorship needs.

runs:
  using: composite
  steps:
    - name: Linux system libraries for Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
